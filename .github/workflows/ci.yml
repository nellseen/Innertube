name: Aetheria CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-deploy:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Step 1 — Static Type Check & Linting
        run: npm run lint

      - name: Step 2 — Unit & Integration Tests
        run: npm run test:unit && npm run test:integration

      - name: Step 3 — Production Applet Build
        run: npm run build

      - name: Step 4 — Start Server in Background for E2E & Load Verification
        run: |
          node server.ts &
          for i in {1..30}; do
            curl -s http://127.0.0.1:3000/api/health && break || sleep 1
          done

      - name: Step 5 — E2E Workflow Test
        run: npm test tests/e2e

      - name: Step 6 — Performance Benchmark & Load Verification
        run: npm run test:load
        env:
          TARGET_URL: 'http://127.0.0.1:3000/api/health'
        continue-on-error: true

      - name: Step 7 — Verify CI Gates
        run: |
          echo "✅ All CI/CD pipeline quality gates passed successfully."
