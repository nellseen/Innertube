name: Aetheria CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-deploy:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Step 1 — Static Type Check & Linting
        run: npm run lint

      - name: Step 2 — Unit, Integration & E2E Test Suite
        run: npm test

      - name: Step 3 — Production Applet Build
        run: npm run build

      - name: Step 4 — Performance Benchmark & Load Verification
        run: npm run test:load
        env:
          TARGET_URL: 'http://127.0.0.1:3000/api/health'
        continue-on-error: true

      - name: Step 5 — Verify CI Gates
        run: |
          echo "✅ All CI/CD pipeline quality gates passed successfully."
